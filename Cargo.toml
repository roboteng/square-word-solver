[package]
name = "square-word"
version = "0.1.0"
edition = "2024"

[features]
default = []
multi-thread = ["rayon", "indicatif/rayon"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
indicatif = { version = "0.17.12" }

regex = "1"
num_cpus = "1.0"
ascii = "1.1.0"
itertools = "0.10.5"
rayon = { version = "1.6.1", optional = true }
fxhash = "0.2.1"

[dev-dependencies]
const-str = "0.5.5"
pretty_assertions = "1.3.0"
proptest = "1.2.0"

[profile.release]
debug = true
lto = "fat"
# codegen-units = 1
panic = "abort"
opt-level = 3
